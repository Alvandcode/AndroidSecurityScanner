name: Build Debug APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Runners ship the Android SDK; the old android-actions/setup-android@v3
      # step broke (it force-installs the removed legacy "tools" package).
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Exercise the release path (R8/ProGuard) so shrinker regressions
      # surface in CI instead of at store-publish time. Unsigned output.
      - name: Build release APK (unsigned, exercises R8)
        run: gradle :app:assembleRelease --stacktrace

      - name: Run unit tests (risk model + catalog parsing)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AndroidSecurityScanner-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidSecurityScanner-debug
          path: AndroidSecurityScanner-debug.apk
